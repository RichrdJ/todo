name: Build & release

# - push naar main      -> image :edge en :sha-xxxxxxx
# - tag vX.Y.Z pushen   -> image :X.Y.Z, :X.Y, :X en :latest + GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stack-bestand met vaste versie
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#v}"
          sed "s#\${KLAAR_VERSION:-latest}#${version}#" stack.yml > klaar-stack.yml
          grep -q "${image}:${version}" klaar-stack.yml
          cat > notes.md <<NOTES
          ## Installeren

          \`\`\`bash
          docker pull ${image}:${version}
          \`\`\`

          Docker Swarm / Portainer: download \`klaar-stack.yml\` hieronder en
          \`\`\`bash
          docker stack deploy -c klaar-stack.yml klaar
          \`\`\`
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: klaar-stack.yml
