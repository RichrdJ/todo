<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d14">
  <title>ToDo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem('klaar.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <button class="brand-home" id="brandHome" title="Naar je startpagina">
          <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8.5 13.5l4 4L23.5 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 24h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/></svg></span>
          <span class="brand-text">
            <span class="wordmark">To<span>Do</span></span>
            <span class="brand-sub" id="brandDate"></span>
          </span>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Instellingen (,)" aria-label="Instellingen">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="icon-btn theme-toggle" id="themeToggle" title="Thema wisselen" aria-label="Thema wisselen"></button>
        <button class="icon-btn" id="logoutBtn" title="Uitloggen" aria-label="Uitloggen" hidden>
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Zoeken" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <nav class="nav" id="nav"></nav>

      <div id="groups">
        <div class="section-head">
          <span>Klanten</span>
          <button class="icon-btn small" data-add="client" title="Nieuwe klant" aria-label="Nieuwe klant">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <nav class="nav" id="clients"></nav>
        <div class="section-head">
          <span>Projecten</span>
          <button class="icon-btn small" data-add="project" title="Nieuw project" aria-label="Nieuw project">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <nav class="nav" id="projects"></nav>
        <div class="section-head">
          <span>Categorieën</span>
          <button class="icon-btn small" data-add="category" title="Nieuwe categorie" aria-label="Nieuwe categorie">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <nav class="nav" id="categories"></nav>
      </div>

      <div class="sidebar-foot">
        <a href="/api/export" class="foot-link" title="Download al je taken als JSON">
          <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Export
        </a>
        <span class="shortcuts" title="N nieuw · / zoeken · 1–6 weergave · , instellingen"><kbd>N</kbd> nieuw · <kbd>1</kbd>–<kbd>6</kbd></span>
        <a class="version" id="version" href="https://github.com/RichrdJ/todo/releases" target="_blank" rel="noopener"></a>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="heading">
          <h1 id="viewTitle">Agenda</h1>
          <p id="viewSub"></p>
        </div>
        <div class="view-tools" id="viewTools"></div>
        <div class="progress" id="progress" hidden>
          <svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="bar" id="progressBar" cx="22" cy="22" r="18"/></svg>
          <span id="progressText"></span>
        </div>
      </header>

      <form class="composer" id="composer" autocomplete="off">
        <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <input id="newTitle" placeholder="Nieuwe taak…  probeer: Notulen sturen @morgen !hoog #klant +overleg" maxlength="500">
        <button type="submit" class="btn primary">Toevoegen</button>
        <div class="chips" id="chips"></div>
      </form>

      <section class="list-wrap" id="listWrap"></section>
    </main>

    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="modal" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
