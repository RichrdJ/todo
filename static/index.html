<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d14">
  <title>Klaar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem('klaar.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Klaar</span>
        <button class="icon-btn theme-toggle" id="themeToggle" title="Thema wisselen" aria-label="Thema wisselen"></button>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Zoeken" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <nav class="nav" id="nav"></nav>

      <div class="section-head">
        <span>Projecten</span>
        <button class="icon-btn small" id="addProject" title="Nieuw project" aria-label="Nieuw project">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <nav class="nav projects" id="projects"></nav>

      <div class="sidebar-foot">
        <a href="/api/export" class="foot-link" title="Download al je taken als JSON">
          <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Export
        </a>
        <span class="shortcuts" title="N nieuw · / zoeken · 1–5 weergave"><kbd>N</kbd> nieuw · <kbd>1</kbd>–<kbd>5</kbd></span>
        <a class="version" id="version" href="https://github.com/RichrdJ/todo/releases" target="_blank" rel="noopener"></a>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="heading">
          <h1 id="viewTitle">Vandaag</h1>
          <p id="viewSub"></p>
        </div>
        <div class="progress" id="progress" hidden>
          <svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="bar" id="progressBar" cx="22" cy="22" r="18"/></svg>
          <span id="progressText"></span>
        </div>
      </header>

      <form class="composer" id="composer" autocomplete="off">
        <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <input id="newTitle" placeholder="Nieuwe taak…  probeer: Offerte sturen @morgen !hoog #Sales" maxlength="500">
        <button type="submit" class="btn primary">Toevoegen</button>
        <div class="chips" id="chips"></div>
      </form>

      <section class="list-wrap" id="listWrap"></section>
    </main>

    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="modal" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
