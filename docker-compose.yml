services:
  klaar:
    build: .
    # Of gebruik de kant-en-klare image van GitHub Container Registry:
    # image: ghcr.io/<jouw-github-gebruiker>/klaar:latest
    container_name: klaar
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      - klaar-data:/data
    environment:
      TZ: Europe/Amsterdam
      # Inloggen aanzetten: maak een versleuteld wachtwoord met
      #   docker run --rm -it ghcr.io/richrdj/todo:latest python server.py hash-password
      # en zet de uitkomst hieronder.
      # APP_USER: admin
      # APP_PASSWORD_HASH: "pbkdf2_sha256:600000:..."

volumes:
  klaar-data:
